<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR scanner</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body { margin: 0; min-height: 100%; }

    body {
      font-family: system-ui, sans-serif;
      background: #faf8ef;
      color: #776e65;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
    }

    header,
    main { width: min(90vmin, 480px); }

    header { display: flex; align-items: center; gap: .6rem; }

    h1 { margin: 0 auto 0 0; font-size: 1.8rem; }

    h1 a { color: inherit; text-decoration: none; }

    main { display: flex; flex-direction: column; gap: 1rem; }

    #stage {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      background: #bbada0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #video { width: 100%; height: 100%; object-fit: cover; display: none; }

    #video.on { display: block; }

    #msg {
      position: absolute;
      margin: 0;
      padding: 0 2rem;
      text-align: center;
      line-height: 1.45;
      color: #f9f6f2;
    }

    #msg[hidden] { display: none; }

    #stage.on::after {
      content: "";
      position: absolute;
      inset: 16%;
      border: 2px solid #f9f6f2cc;
      border-radius: 8px;
      pointer-events: none;
    }

    #out {
      display: flex;
      flex-direction: column;
      gap: .6rem;
      padding: .9rem;
      border-radius: 8px;
      background: #eee4da;
    }

    #out[hidden],
    #link[hidden],
    #copy[hidden],
    #stop[hidden] { display: none; }

    #text {
      margin: 0;
      max-height: 9rem;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #link { color: #8f7a66; }

    .row { display: flex; flex-wrap: wrap; gap: .5rem; }

    button {
      font: inherit;
      font-size: .9rem;
      padding: .55rem .9rem;
      border: 0;
      border-radius: 6px;
      background: #8f7a66;
      color: #f9f6f2;
      cursor: pointer;
    }

    small { color: #bbada0; font-size: .75rem; line-height: 1.4; }
  </style>
</head>

<body>
  <header>
    <h1><a href="../">QR scanner</a></h1>
  </header>
  <main>
    <div id="stage">
      <video id="video" playsinline muted aria-label="Camera preview"></video>
      <p id="msg">Tap “Start camera” and point it at a QR code.</p>
    </div>
    <div id="out" hidden aria-live="polite">
      <p id="text"></p>
      <a id="link" target="_blank" rel="noopener noreferrer" hidden>Open link ↗</a>
    </div>
    <div class="row">
      <button id="start">Start camera</button>
      <button id="upload">Upload photo</button>
      <button id="stop" hidden>Stop</button>
      <button id="copy" hidden>Copy</button>
    </div>
    <input id="photo" type="file" accept="image/*" hidden>
    <small>Decoding happens in this tab — nothing is uploaded. The camera needs https or localhost.</small>
  </main>

  <script src="jsQR.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const stage = $('stage'), video = $('video');

    // http(s) only: a scanned javascript: URL must never become a clickable link here.
    const safeUrl = text => {
      try {
        const url = new URL(text);
        return /^https?:$/.test(url.protocol) ? url.href : null;
      } catch { return null; }
    };

    let stream, timer, scanning = false, canvas, pixels;

    const setMsg = text => { $('msg').textContent = text; $('msg').hidden = !text; };

    const clearResult = () => {
      $('out').hidden = true;
      $('copy').hidden = true;
      $('text').textContent = '';
    };

    function stop() {
      scanning = false;
      clearTimeout(timer);
      for (const track of stream?.getTracks() ?? []) track.stop();
      stream = video.srcObject = null;
      video.classList.remove('on');
      stage.classList.remove('on');
      $('stop').hidden = true;
      $('start').hidden = false;
      setMsg('Tap “Start camera” and point it at a QR code.');
    }

    function show(text) {
      stop();
      $('msg').hidden = true;
      $('out').hidden = false;
      $('text').textContent = text;
      const link = safeUrl(text);
      $('link').hidden = !link;
      if (link) $('link').href = link;
      $('copy').hidden = false;
      $('start').textContent = 'Scan again';
    }

    function decode(source, vw, vh, max) {
      if (!vw || !vh) return null;
      // Downscale big frames: plenty for a QR code and much cheaper to decode.
      const scale = Math.min(1, max / Math.max(vw, vh));
      const w = Math.round(vw * scale), h = Math.round(vh * scale);
      canvas ??= document.createElement('canvas');
      pixels ??= canvas.getContext('2d', { willReadFrequently: true });
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      pixels.drawImage(source, 0, 0, w, h);
      return jsQR(pixels.getImageData(0, 0, w, h).data, w, h)?.data ?? null;
    }

    function tick() {
      if (!scanning) return;
      const vw = video.videoWidth, vh = video.videoHeight;
      const text = vw && vh ? decode(video, vw, vh, 800) : null;
      if (text) return show(text);
      timer = setTimeout(tick, 200);
    }

    async function scanPhoto(file) {
      if (typeof jsQR !== 'function') return setMsg('The QR decoder failed to load.');
      stop();
      clearResult();
      setMsg('Reading photo…');
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.src = url;
      try {
        await img.decode();
      } catch {
        URL.revokeObjectURL(url);
        return setMsg('Could not read that image.');
      }
      URL.revokeObjectURL(url);
      const text = decode(img, img.naturalWidth, img.naturalHeight, 1600);
      if (text) show(text);
      else setMsg('No QR code found in that image.');
    }

    async function start() {
      if (typeof jsQR !== 'function') return setMsg('The QR decoder failed to load.');
      clearResult();
      $('start').textContent = 'Start camera';
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        return setMsg('The camera needs https (or localhost) and a browser with camera support.');
      }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
        });
      } catch (e) {
        console.error(e);
        return setMsg(e.name === 'NotAllowedError'
          ? 'Camera permission was denied (NotAllowedError). Allow camera access for this site and for the browser app.'
          : `Could not open the camera (${e.name || 'error'}).`);
      }
      video.srcObject = stream;
      try {
        await video.play();
      } catch {
        stop();
        return setMsg('Could not start the camera.');
      }
      video.classList.add('on');
      stage.classList.add('on');
      $('msg').hidden = true;
      $('start').hidden = true;
      $('stop').hidden = false;
      scanning = true;
      tick();
    }

    async function copy() {
      try {
        await navigator.clipboard.writeText($('text').textContent);
        $('copy').textContent = 'Copied';
      } catch {
        $('copy').textContent = 'Copy failed';
      }
      setTimeout(() => $('copy').textContent = 'Copy', 1200);
    }

    $('start').addEventListener('click', start);
    $('stop').addEventListener('click', stop);
    $('copy').addEventListener('click', copy);
    $('upload').addEventListener('click', () => $('photo').click());
    $('photo').addEventListener('change', e => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (file) scanPhoto(file);
    });
    addEventListener('pagehide', stop);
  </script>
</body>

</html>
