<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, sans-serif; background: #faf8ef; color: #776e65;
    display: flex; flex-direction: column; align-items: center; gap: 1rem;
    padding: 1rem; user-select: none; -webkit-user-select: none;
  }
  header { width: min(90vmin, 480px); display: flex; align-items: center; gap: .6rem; }
  h1 { margin: 0 auto 0 0; font-size: 1.8rem; }
  .score { background: #bbada0; color: #f9f6f2; padding: .35rem .7rem; border-radius: 6px; font-size: .7rem; text-align: center; line-height: 1.3; }
  .score b { display: block; font-size: 1.05rem; color: #fff; }
  button {
    font: inherit; font-size: .85rem; padding: .5rem .8rem; border: 0; border-radius: 6px;
    background: #8f7a66; color: #f9f6f2; cursor: pointer;
  }
  a { color: #8f7a66; }
  /* touch-action is on the field only, so the page still scrolls/pull-to-refreshes elsewhere */
  #wrap { position: relative; width: min(90vmin, 480px); aspect-ratio: 1; touch-action: none; }
  #board {
    position: absolute; inset: 0; background: #bbada0; border-radius: 8px;
    --gap: 2%; --cell: calc((100% - 5 * var(--gap)) / 4);
  }
  .slot, .tile { position: absolute; width: var(--cell); height: var(--cell); border-radius: 6px; }
  .slot { background: #cdc1b4; }
  .tile {
    display: flex; align-items: center; justify-content: center; background: #cdc1b4;
    font-weight: 700; font-size: clamp(1rem, 7vmin, 2.4rem); color: #776e65;
    transition: left .25s ease, top .25s ease;
  }
  .tile.new    { animation: pop .25s ease; }
  .tile.merged { animation: pop .18s ease; }
  @keyframes pop { from { transform: scale(0); } }
  .tile[data-v="2"]    { background: #eee4da; }
  .tile[data-v="4"]    { background: #ede0c8; }
  .tile[data-v="8"]    { background: #f2b179; color: #f9f6f2; }
  .tile[data-v="16"]   { background: #f59563; color: #f9f6f2; }
  .tile[data-v="32"]   { background: #f67c5f; color: #f9f6f2; }
  .tile[data-v="64"]   { background: #f65e3b; color: #f9f6f2; }
  .tile[data-v="128"]  { background: #edcf72; color: #f9f6f2; }
  .tile[data-v="256"]  { background: #edcc61; color: #f9f6f2; }
  .tile[data-v="512"]  { background: #edc850; color: #f9f6f2; }
  .tile[data-v="1024"] { background: #edc53f; color: #f9f6f2; font-size: clamp(.8rem, 5vmin, 1.7rem); }
  .tile[data-v="2048"] { background: #edc22e; color: #f9f6f2; font-size: clamp(.8rem, 5vmin, 1.7rem); }
  #overlay {
    position: absolute; inset: 0; display: none; flex-direction: column; z-index: 2;
    align-items: center; justify-content: center; gap: 1rem;
    background: rgba(238, 228, 218, .73); border-radius: 8px; font-size: 1.5rem; font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>2048</h1>
  <div class="score">Score<b id="score">0</b></div>
  <button id="reset">Reset</button>
</header>
<div id="wrap">
  <div id="board"></div>
  <div id="overlay"><p id="msg"></p><button id="restart">New game</button></div>
</div>
<footer><a href="2048-guide.html">Strategy guide →</a></footer>

<script>
const N = 4, $ = id => document.getElementById(id);
const pos = n => `calc(var(--gap) * ${n + 1} + var(--cell) * ${n})`;

let board, tiles, score, won, over, busy, absorbed;

const lines = dir => Array.from({ length: N }, (_, i) => Array.from({ length: N }, (_, j) => {
  const [r, c] = dir === 'left'  ? [i, j]
    : dir === 'right' ? [i, N - 1 - j]
    : dir === 'up'    ? [j, i]
    : [N - 1 - j, i];
  return r * N + c;
}));

function createTile(v, r, c, isNew) {
  const el = document.createElement('div');
  el.className = 'tile';
  el.textContent = v;
  el.dataset.v = v;
  el.style.left = pos(c);
  el.style.top = pos(r);
  $('board').append(el);
  const t = { v, r, c, el };
  tiles.push(t);
  if (isNew) el.classList.add('new');
  return t;
}

function place(t, r, c) {
  t.r = r; t.c = c;
  t.el.style.left = pos(c);
  t.el.style.top = pos(r);
}

// Moves every tile to where it lands (both halves of a merge share a cell), so
// the CSS transition animates the slide. Values/removals happen later in settle().
function move(dir) {
  const next = Array(N * N).fill(null);
  absorbed = [];
  let moved = false;
  for (const line of lines(dir)) {
    const row = line.map((idx, oi) => ({ t: board[idx], oi })).filter(x => x.t);
    let slot = 0, k = 0;
    while (k < row.length) {
      const a = row[k], b = row[k + 1];
      const i = line[slot], [r, c] = [(i / N) | 0, i % N];
      if (b && b.t.v === a.t.v) {
        place(a.t, r, c); place(b.t, r, c);
        a.t.merge = true;
        absorbed.push(b.t);
        next[i] = a.t;
        moved = true;
        k += 2;
      } else {
        if (a.oi !== slot) moved = true;
        place(a.t, r, c);
        next[i] = a.t;
        k += 1;
      }
      slot++;
    }
  }
  board = next;
  return moved;
}

function settle() {
  for (const t of absorbed) t.el.remove();
  tiles = tiles.filter(t => !absorbed.includes(t));
  absorbed = [];
  for (const t of board) {
    if (t && t.merge) {
      t.merge = false;
      t.v *= 2; score += t.v;
      t.el.textContent = t.v; t.el.dataset.v = t.v;
      t.el.classList.remove('merged'); void t.el.offsetWidth; t.el.classList.add('merged');
    }
  }
}

function addTile() {
  const empty = [];
  board.forEach((t, i) => { if (!t) empty.push(i); });
  if (!empty.length) return;
  const i = empty[Math.floor(Math.random() * empty.length)];
  board[i] = createTile(Math.random() < 0.9 ? 2 : 4, (i / N) | 0, i % N, true);
}

const canMove = () => board.some((t, i) =>
  !t || (i % N < N - 1 && board[i + 1] && board[i + 1].v === t.v)
      || (i < N * (N - 1) && board[i + N] && board[i + N].v === t.v));

const drawScore = () => $('score').textContent = score;
const show = msg => { $('msg').textContent = msg; $('overlay').style.display = 'flex'; };

function init() {
  board = Array(N * N).fill(null);
  tiles = []; absorbed = [];
  score = 0; won = over = busy = false;
  $('board').querySelectorAll('.tile').forEach(el => el.remove());
  addTile(); addTile();
  $('overlay').style.display = 'none';
  drawScore();
}

function turn(dir) {
  if (busy || over || !move(dir)) return;
  busy = true;
  setTimeout(() => {
    settle();
    addTile();
    drawScore();
    busy = false;
    if (!won && board.some(t => t && t.v >= 2048)) { won = true; show('You win!'); }
    else if (!canMove()) { over = true; show('Game over'); }
  }, 250);
}

const keys = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
addEventListener('keydown', e => { const d = keys[e.key]; if (d) { e.preventDefault(); turn(d); } });

let sx = 0, sy = 0;
const wrap = $('wrap');
wrap.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
wrap.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});

for (let i = 0; i < N * N; i++) {
  const s = document.createElement('div');
  s.className = 'slot';
  s.style.left = pos(i % N);
  s.style.top = pos((i / N) | 0);
  $('board').append(s);
}

$('reset').addEventListener('click', init);
$('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
