server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  # connect-src must include the lobby WebSocket origin (wss://lobby.co3d.eu).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://lobby.co3d.eu ws://localhost:8080; frame-ancestors 'none'; base-uri 'none'" always;

  location = /nginx.conf {
    deny all;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
