<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>drone printer</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, sans-serif; color: #ede7ff;
    display: flex; flex-direction: column; align-items: center; gap: .6rem;
    padding: .7rem; user-select: none; -webkit-user-select: none;
    background: radial-gradient(120% 80% at 50% 0%, #5b34a8 0%, #210f45 72%);
  }
  header { width: min(94vw, 58vh); display: flex; align-items: center; gap: .5rem; }
  h1 { margin: 0 auto 0 0; font-size: 1rem; letter-spacing: .12em; }
  .stat { background: #3a2566; padding: .3rem .55rem; border-radius: 6px; font-size: .62rem; text-align: center; line-height: 1.25; }
  .stat b { display: block; font-size: .95rem; color: #cdb4ff; }

  #canvasWrap { position: relative; width: min(94vw, 58vh); }
  canvas { width: 100%; aspect-ratio: 1; display: block; border-radius: 12px; background: #ffffff; touch-action: none;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .18), 0 14px 30px rgba(0, 0, 0, .45); }

  #dock { width: min(94vw, 58vh); display: flex; gap: .5rem; align-items: stretch; }
  .lanes { display: flex; gap: .5rem; flex: 1; }
  .lane { position: relative; flex: 1; height: 6.1rem; overflow: hidden; border-radius: 8px;
    background: rgba(20, 8, 44, .5); display: flex; flex-direction: column; gap: .35rem; padding: .35rem; }
  .drone { position: relative; flex: 0 0 2.6rem; border-radius: 7px; cursor: pointer;
    background: rgba(255, 255, 255, .10); display: flex; align-items: center; justify-content: center; }
  .drone canvas { height: 100%; aspect-ratio: 1; width: auto; display: block; }
  .drone .mag { position: absolute; right: .2rem; bottom: .1rem; font-size: .62rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
  .drone.next { opacity: .5; }
  .drone.front { box-shadow: 0 0 0 2px #9fe8ff; }
  /* a drone whose colour is on the print frontier can fire right now */
  .drone.ready, .drone.front.ready { box-shadow: 0 0 0 2px #57e08a, 0 0 12px rgba(87, 224, 138, .85); }

  .park { display: flex; flex-direction: column; gap: .35rem; }
  .pad { position: relative; width: 2.6rem; flex: 1; border-radius: 7px; border: 1px dashed rgba(200, 190, 255, .35);
    display: flex; align-items: center; justify-content: center; }
  .pad canvas { height: 100%; aspect-ratio: 1; width: auto; display: block; }
  .pad .mag { position: absolute; right: .2rem; bottom: .05rem; font-size: .58rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
  .pad.full { background: rgba(255, 255, 255, .10); border-style: solid; cursor: pointer; }
  .pad.ready { box-shadow: 0 0 0 2px #57e08a, 0 0 12px rgba(87, 224, 138, .85); }

  #hint { margin: 0; width: min(94vw, 58vh); text-align: center; font-size: .72rem; color: rgba(237, 231, 255, .72); }

  #overlay { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 20;
    align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 1.5rem;
    background: rgba(6, 9, 18, .86); font-size: 1.2rem; font-weight: 700; }
  button { font: inherit; font-size: .9rem; padding: .55rem .9rem; border: 0; border-radius: 8px; background: #3d6ea8; color: #eaf6ff; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>DRONE PRINTER</h1>
  <div class="stat">Level<b id="level">1/3</b></div>
  <div class="stat">Score<b id="score">0</b></div>
</header>
<div id="canvasWrap"><canvas id="view"></canvas></div>
<div id="dock">
  <div class="lanes">
    <div class="lane" id="lane0"></div>
    <div class="lane" id="lane1"></div>
    <div class="lane" id="lane2"></div>
  </div>
  <div class="park">
    <i class="pad" id="pad0"></i>
    <i class="pad" id="pad1"></i>
    <i class="pad" id="pad2"></i>
  </div>
</div>
<p id="hint">Glowing drones can print right now. Tap the front one to send it; tap the dimmer one to bring it forward.</p>
<div id="overlay"><p id="msg"></p><button id="restart">Play again</button></div>

<script>
const G = 16, KEYS = ['r', 'b', 'g', 'w', 'k'];
const TAU = Math.PI * 2;
const HEX = { r: '#e8453c', b: '#3f7be0', g: '#45b95a', w: '#ffffff', k: '#232833' };
const idxOf = {}; KEYS.forEach((k, i) => idxOf[k] = i);
const hexA = (hex, a) => {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};

// A field can ask for a single colour, or two shots of different colours that mix
// once both have landed. Keys are the art characters for the mixed result.
const MIXES = {
  p: { a: 0, b: 1, hex: '#8a4fd0' }, // red + blue -> purple
  o: { a: 0, b: 2, hex: '#9c7a2e' }, // red + green -> brown
  i: { a: 0, b: 3, hex: '#f2a0b4' }, // red + white -> pink
};
const MIXHEX = new Array(KEYS.length * KEYS.length).fill(null);
for (const m of Object.values(MIXES)) MIXHEX[m.a * KEYS.length + m.b] = m.hex;

const MAX_FLY = 5; // drones allowed in the air at once

const FLIGHT = 4.5;   // seconds for one lap around the canvas
const SHOT_GAP = 0.05; // seconds between shots
const LEAVE_T = 0.6;  // seconds a spent drone takes to fly offscreen

// The final image of each level, one string per row. '.' is background: it is never
// painted, so drones only ever cover the actual motif.
const LEVELS = [
  { name: 'Rubik\'s cube', art: [
    '................',
    '.rrrrkbbbbkgggg.',
    '.rrrrkbbbbkgggg.',
    '.rrrrkbbbbkgggg.',
    '.rrrrkbbbbkgggg.',
    '.kkkkkkkkkkkkkk.',
    '.bbbbkggggkwwww.',
    '.bbbbkggggkwwww.',
    '.bbbbkggggkwwww.',
    '.bbbbkggggkwwww.',
    '.kkkkkkkkkkkkkk.',
    '.ggggkwwwwkrrrr.',
    '.ggggkwwwwkrrrr.',
    '.ggggkwwwwkrrrr.',
    '.ggggkwwwwkrrrr.',
    '................',
  ] },
  { name: 'Superhero', art: [
    '................',
    '................',
    '.....wwwwww.....',
    '....wwwwwwww....',
    '....wwkwwkww....',
    '....wwwwwwww....',
    '.....wwwwww.....',
    '..rrbbbbbbbbrr..',
    '..rrbbbbbbbbrr..',
    '..rrbbbbbbbbrr..',
    '..rrbbbbbbbbrr..',
    '...bbbbbbbbbb...',
    '....bbbbbbbb....',
    '.....bb..bb.....',
    '.....kk..kk.....',
    '................',
  ] },
  { name: 'House', art: [
    '................',
    '................',
    '................',
    '......rrrr......',
    '.....rrrrrr.....',
    '....rrrrrrrr....',
    '...rrrrrrrrrr...',
    '..rrrrrrrrrrrr..',
    '.wwwwwwwwwwwwww.',
    '.wwkkwwwwwwkkww.',
    '.wwkkwwwwwwkkww.',
    '.wwwwwwwwwwwwww.',
    '.wwwwwwkkwwwwww.',
    '.wwwwwwkkwwwwww.',
    '.wwwwwwkkwwwwww.',
    '................',
  ] },
  { name: 'Dog', art: [
    '................',
    '................',
    '..kk........kk..',
    '..koo......ook..',
    '..koo......ook..',
    '..koo......ook..',
    '..oooooooooooo..',
    '..ookooooooook..',
    '..oooooooooooo..',
    '..oooooooooooo..',
    '..ooowwwwwwwoo..',
    '..oowwkkkkwwoo..',
    '..ooowwwwwwwoo..',
    '...oooooooooo...',
    '.......ii.......',
    '................',
  ] },
  { name: 'Butterfly', art: [
    '................',
    '................',
    '.....k....k.....',
    '......k..k......',
    '...ppppkkpppp...',
    '..pppppkkppppp..',
    '..ppwppkkppwpp..',
    '...ppppkkpppp...',
    '...ppppkkpppp...',
    '....pppkkppp....',
    '.....ppkkpp.....',
    '.......kk.......',
    '................',
    '................',
    '................',
    '................',
  ] },
];

// --- level building (pure) ----------------------------------------------------
// Turn the art into two required colours per cell (a mixed cell needs both) plus the
// shot count each drone colour must supply.
function parseArt(art) {
  const needA = new Int8Array(G * G).fill(-1);
  const needB = new Int8Array(G * G).fill(-1);
  const counts = new Array(KEYS.length).fill(0);
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
    const ch = art[y][x], i = y * G + x;
    const single = idxOf[ch];
    if (single !== undefined) { needA[i] = single; counts[single]++; continue; }
    const m = MIXES[ch];
    if (m) { needA[i] = m.a; needB[i] = m.b; counts[m.a]++; counts[m.b]++; }
  }
  return { needA, needB, counts };
}

// Split each colour's total into drone magazines. The aim sizes cycle for variety;
// magazines land in the 10-20 range and levels in the 10-40 drone range.
function splitCounts(counts) {
  const targets = [11, 12, 10, 13, 11, 12, 10];
  let ti = 0;
  const drones = [];
  counts.forEach((total, color) => {
    if (!total) return;
    const n = Math.max(1, Math.round(total / targets[ti++ % targets.length]));
    const base = Math.floor(total / n), extra = total % n;
    for (let i = 0; i < n; i++) drones.push({ color, mag: base + (i < extra ? 1 : 0) });
  });
  return drones;
}

// Deterministic shuffle so a level always looks the same and tests stay stable.
function shuffle(a, seed) {
  let s = seed >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = a.length - 1; i > 0; i--) {
    const j = (rnd() * (i + 1)) | 0;
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// --- aiming (pure) ------------------------------------------------------------
// Each cell belongs to a small angular wedge around the direction from the centre
// to its middle. A drone at angle `a` reaches the cells whose wedge covers `a`,
// nearest first. (A per-pixel raycast would make some pixels reachable only at a
// single exact angle, which no discrete sweep ever hits.)
const CELL_ANG = new Float64Array(G * G), CELL_R2 = new Float64Array(G * G), CELL_HALF = new Float64Array(G * G);
{
  const c = (G - 1) / 2;
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) {
    const i = y * G + x, dx = x - c, dy = y - c, r = Math.hypot(dx, dy);
    CELL_ANG[i] = Math.atan2(dy, dx);
    CELL_R2[i] = dx * dx + dy * dy;
    CELL_HALF[i] = Math.min(0.5, 0.8 / Math.max(1, r) + 0.02);
  }
  CELL_HALF[Math.floor(G / 2) * G + Math.floor(G / 2)] = Math.PI; // the centre is reachable from every direction
}

// The wedge for every heading is the same for every level, so build them once.
const NBINS = 360, RAYS = new Array(NBINS);
{
  for (let k = 0; k < NBINS; k++) {
    const a = k * TAU / NBINS, out = [];
    for (let i = 0; i < G * G; i++) {
      let d = CELL_ANG[i] - a;
      if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
      if (d > -CELL_HALF[i] && d < CELL_HALF[i]) out.push(i);
    }
    RAYS[k] = out.sort((p, q) => CELL_R2[p] - CELL_R2[q]);
  }
}
const binOf = a => Math.round((a - TAU * Math.floor(a / TAU)) / TAU * NBINS) % NBINS;
const rayCells = a => RAYS[binOf(a)];

const firstShootable = (ray, c) => {
  for (const i of ray) {
    if (needA[i] < 0 || paint[i]) continue;
    // the most central unfinished field: printable only if this colour is still owed
    return (needA[i] === c && !gotA[i]) || (needB[i] === c && !gotB[i]) ? i : -1;
  }
  return -1;
};

// The one cell a drone may print right now: the most central unfinished cell along
// its ray, and only if that cell still owes its colour (you cannot print past a gap).
const shootTargetAt = (d, a) => firstShootable(rayCells(a), d.color);
const shootTarget = d => shootTargetAt(d, d.ang);

// As it sweeps, a drone also aims at the neighbouring headings. A pixel can sit in a
// sliver between two sampled headings and, since every lap samples the same ones, it
// would jam the print forever. The exact heading is tried first; the fan is fallback.
function aimTarget(d) {
  const b = binOf(d.ang);
  for (let j = 0; j <= 3; j++) for (const o of (j === 0 ? [0] : [j, -j])) {
    const i = firstShootable(RAYS[(b + o + NBINS) % NBINS], d.color);
    if (i >= 0) return i;
  }
  return -1;
}

// Colours still owed by the current print frontier, sampled over a full circle.
function frontierColors() {
  const s = new Set();
  for (let k = 0; k < NBINS; k++) {
    const ray = RAYS[k];
    let i = -1;
    for (const j of ray) if (needA[j] >= 0 && !paint[j]) { i = j; break; }
    if (i < 0) continue;
    if (!gotA[i]) s.add(needA[i]);
    if (needB[i] >= 0 && !gotB[i]) s.add(needB[i]);
  }
  return s;
}

// --- game state ---------------------------------------------------------------
let needA, needB, gotA, gotB, paint, lanes, flying, parked, particles;
let phase, paintedCount, totalTargets, totalDrones, level, score, best;
let readyColors = new Set(), readyT = 0;

const HINT = 'Glowing drones can print right now. Tap the front one to send it; tap the dimmer one to bring it forward.';
const $ = id => document.getElementById(id);
const setHint = t => { const h = $('hint'); if (h) h.textContent = t; };
const KEY = 'drone-printer';
const save = () => { try { best = Math.max(best, score); localStorage.setItem(KEY, JSON.stringify({ level, score, best })); } catch {} };
const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };

// Land one shot of colour c on a field; it is finished once every owed colour is in.
function applyShot(i, c) {
  if (needA[i] === c) gotA[i] = 1; else if (needB[i] === c) gotB[i] = 1;
  if (gotA[i] && (needB[i] < 0 || gotB[i])) { paint[i] = 1; paintedCount++; }
}

function loadLevel(n) {
  level = n;
  const parsed = parseArt(LEVELS[n].art);
  needA = parsed.needA; needB = parsed.needB;
  gotA = new Uint8Array(G * G); gotB = new Uint8Array(G * G);
  paint = new Uint8Array(G * G);
  paintedCount = 0;
  totalTargets = 0;
  for (let i = 0; i < G * G; i++) if (needA[i] >= 0) totalTargets++;

  const arsenal = splitCounts(parsed.counts);
  totalDrones = arsenal.length;
  shuffle(arsenal, 1337 + n * 911);
  lanes = [[], [], []];
  arsenal.forEach((d, i) => lanes[i % 3].push(d));

  flying = []; parked = [null, null, null]; particles = [];
  phase = 'play';
  readyColors = frontierColors();
  boardLevel = -1; // force the cached splat layer to rebuild (also clears it on retry)
  boardLayer(layout());
  hideOverlay();
  setHint(HINT);
  renderLanes(); renderPads(); updateHud();
}

function startFlight(d) {
  d.ang = -Math.PI / 2 + flying.length * 0.35;
  d.swept = 0; d.cd = 0; d.t = 0; d.state = 'fly';
  flying.push(d);
}

function launchFromLane(li) {
  if (phase !== 'play' || flying.length >= MAX_FLY || !lanes[li] || !lanes[li].length) return false;
  startFlight(lanes[li].shift());
  return true;
}

function relaunchParked(pi) {
  if (phase !== 'play' || flying.length >= MAX_FLY || !parked[pi]) return false;
  const d = parked[pi];
  parked[pi] = null;
  startFlight(d);
  renderPads();
  return true;
}

// Bring the next drone in a lane forward without spending a landing pad. This is
// what lets any colour be reached, so a level's winning order is always sendable.
function cycleLane(li) {
  if (phase !== 'play' || !lanes[li] || lanes[li].length < 2) return false;
  lanes[li].push(lanes[li].shift());
  return true;
}

function land(d) {
  if (phase !== 'play') return;
  const free = parked.indexOf(null);
  if (free < 0) { crash(); return; }
  parked[free] = d;
  renderPads();
}

// A drone finished a lap with shots left. If no landing pad is free, it crashes.
function maybeStuck() {
  if (phase !== 'play' || flying.length || paintedCount >= totalTargets) return;
  const need = frontierColors();
  const canWork = [...lanes.flat(), ...parked.filter(Boolean)].some(d => d.mag > 0 && need.has(d.color));
  if (!canWork) { phase = 'over'; showOverlay('Stuck: no drone can print the next dots.', 'Retry level', () => loadLevel(level)); }
}

function crash() {
  phase = 'over';
  save();
  showOverlay('Drone crash! Every landing pad was full.', 'Retry level', () => loadLevel(level));
}

function winLevel() {
  if (phase !== 'play') return;
  phase = 'won';
  const gained = 100 * totalDrones;
  score += gained;
  const last = level >= LEVELS.length - 1;
  save(); updateHud();
  if (last) showOverlay(`You printed everything! Final score ${score}.`, 'Play again', () => { score = 0; best = Math.max(best, score); loadLevel(0); });
  else showOverlay(`${LEVELS[level].name} printed — +${gained}`, 'Next level', () => loadLevel(level + 1));
}

// --- simulation ---------------------------------------------------------------
function advance(dt) {
  if (phase !== 'play') return;
  const w = (Math.PI * 2) / FLIGHT;
  const landers = [];
  flying = flying.filter(d => {
    if (d.state === 'leave') { d.t += dt; return d.t < LEAVE_T; }
    d.ang += w * dt; d.swept += w * dt; d.cd -= dt;
    if (d.cd <= 0) {
      const i = aimTarget(d);
      if (i >= 0) {
        applyShot(i, d.color); d.mag--; d.cd = SHOT_GAP;
        spawnShot(d, i);
        landSplat(i);
      }
    }
    if (d.mag <= 0) { d.state = 'leave'; d.t = 0; return true; }
    if (d.swept >= Math.PI * 2) { landers.push(d); return false; }
    return true;
  });
  for (const d of landers) land(d);
  if (paintedCount >= totalTargets) winLevel();
  else if (!flying.length) maybeStuck();
}

// --- rendering ----------------------------------------------------------------
const view = $('view');
const g2 = view && typeof view.getContext === 'function' ? view.getContext('2d') : null;

function layout() {
  const size = (view && view.width) || 320;
  const grid = size * 0.72;
  return { size, grid, cell: grid / G, ox: (size - grid) / 2, oy: (size - grid) / 2, orbit: grid / 2 + size * 0.085, cx: size / 2, cy: size / 2 };
}

function cellRect(g, i, L, fill, stroke) {
  const inset = L.cell * 0.06;
  const x = L.ox + (i % G) * L.cell + inset;
  const y = L.oy + ((i / G) | 0) * L.cell + inset;
  const s = L.cell - 2 * inset;
  g.fillStyle = fill;
  g.fillRect(x, y, s, s);
  g.lineWidth = Math.max(1, L.cell * 0.05); // set here: splats leave a fatter lineWidth behind
  g.strokeStyle = stroke;
  g.strokeRect(x, y, s, s);
}

// --- paint splat ---------------------------------------------------------------
// A splat is an irregular blob with a few thrown-off droplets. The shape is fixed
// (radii + droplet spots) and only the rotation varies, so it stays cheap to draw.
const SPLAT_R = [1, 0.82, 1.08, 0.78, 0.98, 0.85, 1.06, 0.74, 0.96, 0.88, 1.02];
const SPLAT_DROPS = [
  { a: 0.6, d: 1.6, r: 0.30 }, { a: 2.2, d: 1.75, r: 0.22 }, { a: 3.6, d: 1.5, r: 0.26 },
  { a: 4.9, d: 1.7, r: 0.20 }, { a: 5.9, d: 1.45, r: 0.24 },
];
// Stable per-cell pseudo-random in [0,1): a rebuilt layer looks identical, but each
// splat gets its own size jitter and rotation.
function hash01(n) {
  n = Math.imul(n ^ 61, 0x27d4eb2d);
  n = Math.imul(n ^ (n >>> 15), 0x85ebca6b);
  return ((n ^ (n >>> 13)) >>> 0) / 4294967296;
}
function drawSplat(g, x, y, r, rot, fill, stroke) {
  g.fillStyle = fill;
  g.strokeStyle = stroke;
  g.lineWidth = Math.max(1, r * 0.16);
  g.beginPath();
  for (let i = 0; i < SPLAT_R.length; i++) {
    const a = rot + i * TAU / SPLAT_R.length, rr = r * SPLAT_R[i];
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
  g.fill();
  g.stroke();
  for (const d of SPLAT_DROPS) {
    const a = rot + d.a;
    g.beginPath();
    g.arc(x + Math.cos(a) * r * d.d, y + Math.sin(a) * r * d.d, r * d.r, 0, TAU);
    g.fill();
    g.stroke();
  }
}

// --- drone model ---------------------------------------------------------------
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// A little quadcopter: black body and wings, rotors on the wing tips, and a tank of
// spray colour on top. While it flies the rotors blur into a spinning disk.
function drawDrone(g, x, y, s, color, spinning, ang) {
  g.save();
  g.translate(x, y);
  g.rotate(ang);
  const wing = s * 1.6, edge = Math.max(1, s * 0.06);
  g.lineWidth = edge;
  g.fillStyle = '#1b1e26';
  g.strokeStyle = 'rgba(0, 0, 0, .55)';
  roundRect(g, -wing / 2, -s * 0.14, wing, s * 0.28, s * 0.14);
  g.fill(); g.stroke();

  for (const sx of [-1, 1]) {
    const rx = sx * wing / 2;
    if (spinning) {
      g.fillStyle = 'rgba(175, 190, 220, .5)';
      g.beginPath(); g.arc(rx, 0, s * 0.44, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(80, 95, 130, .55)'; g.stroke();
      g.strokeStyle = 'rgba(255, 255, 255, .55)';
      g.beginPath(); g.arc(rx, 0, s * 0.26, ang, ang + 2.3); g.stroke();
    } else {
      g.fillStyle = '#2a2f3a';
      g.beginPath(); g.arc(rx, 0, s * 0.13, 0, TAU); g.fill();
      g.strokeStyle = '#454d5e'; g.lineWidth = Math.max(1, s * 0.09);
      g.beginPath(); g.moveTo(rx - s * 0.38, 0); g.lineTo(rx + s * 0.38, 0); g.stroke();
      g.beginPath(); g.moveTo(rx, -s * 0.38); g.lineTo(rx, s * 0.38); g.stroke();
      g.lineWidth = edge;
    }
  }

  g.fillStyle = '#111318';
  roundRect(g, -s * 0.5, -s * 0.42, s, s * 0.84, s * 0.28);
  g.fill();
  g.strokeStyle = 'rgba(0, 0, 0, .6)'; g.stroke();

  g.fillStyle = HEX[KEYS[color]];
  g.beginPath(); g.arc(0, 0, s * 0.36, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(0, 0, 0, .4)'; g.lineWidth = Math.max(1, s * 0.05); g.stroke();
  g.restore();
}

// Draw the same drone into a small tile canvas (used by the lanes and parking pads).
function paintDroneTile(cv, color) {
  const g = cv && typeof cv.getContext === 'function' ? cv.getContext('2d') : null;
  if (!g) return;
  g.clearRect(0, 0, cv.width, cv.height);
  drawDrone(g, cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.34, color, false, 0);
}

// --- static board layer --------------------------------------------------------
// The pre-image and every landed splat are cached on their own canvas; they only
// change when a dot lands or the canvas resizes, so a frame does not redraw ~200
// splats. Painting never recolours a tile - it just drops a splat on top of it.
const finalHex = i => needB[i] < 0 ? HEX[KEYS[needA[i]]] : MIXHEX[needA[i] * KEYS.length + needB[i]];
const splatColor = i => paint[i] ? finalHex(i) : HEX[KEYS[gotA[i] ? needA[i] : needB[i]]];
let board = null, boardLevel = -1;
function splatAt(g, i, L) {
  drawSplat(
    g,
    L.ox + ((i % G) + 0.5) * L.cell,
    L.oy + (((i / G) | 0) + 0.5) * L.cell,
    L.cell * 0.5 * (0.95 + hash01(i * 2 + 7) * 0.1), hash01(i * 2 + 1) * TAU,
    splatColor(i), 'rgba(20, 20, 28, .35)',
  );
}
function boardLayer(L) {
  if (!board) board = document.createElement('canvas');
  if (board.width !== L.size || board.height !== L.size || boardLevel !== level) {
    board.width = L.size; board.height = L.size; boardLevel = level;
    const g = board.getContext('2d');
    if (g) {
      g.clearRect(0, 0, L.size, L.size);
      for (let i = 0; i < G * G; i++) if (needA[i] >= 0) {
        const single = needB[i] < 0 ? KEYS[needA[i]] : null;
        // White stays white (it would otherwise look the same as black's grey wash).
        const fill = single === 'w' ? '#ffffff' : hexA(finalHex(i), single === 'k' ? .30 : .16);
        cellRect(g, i, L, fill, 'rgba(30, 30, 42, .10)');
      }
      for (let i = 0; i < G * G; i++) if (gotA[i] || gotB[i]) splatAt(g, i, L);
    }
  }
  return board;
}
function landSplat(i) {
  const L = layout();
  const g = boardLayer(L).getContext('2d');
  if (g) splatAt(g, i, L);
}

function dronePos(d, L) {
  const r = d.state === 'leave' ? L.orbit + (d.t / LEAVE_T) * L.size * 0.35 : L.orbit;
  return { x: L.cx + Math.cos(d.ang) * r, y: L.cy + Math.sin(d.ang) * r };
}

function spawnShot(d, i) {
  const L = layout();
  const p = dronePos(d, L);
  particles.push({
    x: p.x, y: p.y, t: 0, dur: 0.18, c: HEX[KEYS[d.color]], rot: Math.random() * TAU, s: 0.95 + Math.random() * 0.1,
    tx: L.ox + ((i % G) + 0.5) * L.cell, ty: L.oy + (((i / G) | 0) + 0.5) * L.cell,
  });
}

function drawScene(dt) {
  if (!g2) return;
  const L = layout();
  g2.clearRect(0, 0, L.size, L.size);

  g2.strokeStyle = 'rgba(40, 40, 55, .14)';
  g2.lineWidth = Math.max(1, L.size * 0.004);
  g2.beginPath(); g2.arc(L.cx, L.cy, L.orbit, 0, TAU); g2.stroke();

  // Pre-image and landed splats live on a cached layer.
  g2.drawImage(boardLayer(L), 0, 0);

  for (const p of particles) {
    p.t += dt;
    const k = Math.min(1, p.t / p.dur);
    g2.globalAlpha = 1 - k * 0.45;
    drawSplat(g2, p.x + (p.tx - p.x) * k, p.y + (p.ty - p.y) * k, Math.max(2, L.size * 0.014 * p.s * (1 - k * 0.3)), p.rot, p.c, 'rgba(20, 20, 28, .45)');
  }
  g2.globalAlpha = 1;
  particles = particles.filter(p => p.t < p.dur);

  for (const d of flying) {
    const p = dronePos(d, L);
    g2.globalAlpha = d.state === 'leave' ? 1 - d.t / LEAVE_T : 1;
    drawDrone(g2, p.x, p.y, L.size * 0.028, d.color, true, d.ang);
  }
  g2.globalAlpha = 1;
}

function renderLanes() {
  lanes.forEach((lane, li) => {
    const el = $('lane' + li);
    if (!el) return;
    el.textContent = '';
    lane.slice(0, 2).forEach((d, k) => {
      const div = document.createElement('div');
      div.className = 'drone ' + (k === 0 ? 'front' : 'next') + (readyColors.has(d.color) ? ' ready' : '');
      const cv = document.createElement('canvas');
      cv.width = 64; cv.height = 64;
      paintDroneTile(cv, d.color);
      const mag = document.createElement('b');
      mag.className = 'mag';
      mag.textContent = d.mag;
      div.append(cv, mag);
      div.addEventListener('pointerdown', e => {
        if (e && e.preventDefault) e.preventDefault();
        if (k === 0) { if (!launchFromLane(li)) setHint('Five drones are already in the air.'); }
        else cycleLane(li);
        renderLanes();
      });
      el.append(div);
    });
  });
}

function renderPads() {
  parked.forEach((d, pi) => {
    const el = $('pad' + pi);
    if (!el) return;
    el.className = 'pad' + (d ? ' full' : '') + (d && readyColors.has(d.color) ? ' ready' : '');
    el.textContent = '';
    el.onpointerdown = d ? () => relaunchParked(pi) : null;
    if (!d) return;
    const cv = document.createElement('canvas');
    cv.width = 56; cv.height = 56;
    paintDroneTile(cv, d.color);
    const mag = document.createElement('b');
    mag.className = 'mag';
    mag.textContent = d.mag;
    el.append(cv, mag);
  });
}

// Recompute which colours can print right now and update the glow. Cheap enough to
// poll a few times a second; the frontier only moves when a dot lands.
function refreshReady(dt) {
  readyT -= dt;
  if (readyT > 0 || phase !== 'play') return;
  readyT = 0.15;
  const next = frontierColors();
  let changed = next.size !== readyColors.size;
  if (!changed) for (const c of next) if (!readyColors.has(c)) { changed = true; break; }
  if (changed) { readyColors = next; renderLanes(); renderPads(); }
}

function updateHud() {
  $('level').textContent = (level + 1) + '/' + LEVELS.length;
  $('score').textContent = score;
}

function showOverlay(msg, label, fn) {
  $('msg').textContent = msg;
  const b = $('restart');
  b.textContent = label;
  b.onclick = fn;
  $('overlay').style.display = 'flex';
}
const hideOverlay = () => { $('overlay').style.display = 'none'; };

function resize() {
  if (!view || !g2) return;
  const dpr = typeof devicePixelRatio === 'number' ? devicePixelRatio : 1;
  const s = view.clientWidth || 320;
  view.width = Math.round(s * dpr);
  view.height = Math.round(s * dpr);
}

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts;
  advance(dt);
  refreshReady(dt);
  drawScene(dt);
  requestAnimationFrame(frame);
}

// --- boot ---------------------------------------------------------------------
const saved = load();
score = Number.isFinite(saved.score) ? saved.score : 0;
best = Number.isFinite(saved.best) ? saved.best : 0;
const start = Number.isInteger(saved.level) && saved.level >= 0 && saved.level < LEVELS.length ? saved.level : 0;
if (typeof addEventListener === 'function') addEventListener('resize', resize);
loadLevel(start);
resize();
if (g2 && typeof requestAnimationFrame === 'function') requestAnimationFrame(frame);
</script>
</body>
</html>
