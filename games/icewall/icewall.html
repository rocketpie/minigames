<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>icewall</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, sans-serif; background: #1b2440; color: #cfe8ff;
    display: flex; flex-direction: column; align-items: center; gap: .8rem;
    padding: 1rem; user-select: none; -webkit-user-select: none;
  }
  header { width: min(94vw, 46vh); display: flex; align-items: center; gap: .6rem; }
  h1 { margin: 0 auto 0 0; font-size: 1.4rem; letter-spacing: .15em; }
  .stat { background: #2b3a55; padding: .35rem .7rem; border-radius: 6px; font-size: .7rem; text-align: center; line-height: 1.3; }
  .stat b { display: block; font-size: 1.05rem; color: #9fe8ff; }
  button { font: inherit; font-size: .85rem; padding: .5rem .8rem; border: 0; border-radius: 6px; background: #3d6ea8; color: #eaf6ff; cursor: pointer; }

  #board {
    display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(24, 1fr);
    gap: 1px; padding: 2px; background: #0f1730; border-radius: 6px;
    width: min(94vw, 46vh); aspect-ratio: 16 / 24; touch-action: none;
  }
  .cell { background: #23324f; border-radius: 2px; }
  .cell.on { background: #7fd6ff; }
  .cell.hint { background: #d6f6ff; }

  #tray {
    --pc: clamp(10px, 3.4vw, 15px);
    display: flex; align-items: center; justify-content: center; gap: 1.4rem;
    min-height: 5.5rem; width: min(94vw, 46vh); touch-action: none;
  }
  .shape { position: relative; cursor: grab; }
  .pc { position: absolute; width: var(--pc); height: var(--pc); border-radius: 2px; background: #7fd6ff; }

  #ghost { position: fixed; z-index: 10; pointer-events: none; }
  #ghost .pc { background: rgba(127, 214, 255, .55); }

  #overlay {
    position: fixed; inset: 0; display: none; flex-direction: column; z-index: 20;
    align-items: center; justify-content: center; gap: 1rem;
    background: rgba(15, 23, 48, .8); font-size: 1.5rem; font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>ICEWALL</h1>
  <div class="stat">Score<b id="score">0</b></div>
  <div class="stat">Mult<b id="mult">×1</b></div>
  <button id="reset">Reset</button>
</header>
<div id="board"></div>
<div id="tray"></div>
<div id="overlay"><p id="msg"></p><button id="restart">New game</button></div>

<script>
const W = 16, H = 24, SIZE = W * H, $ = id => document.getElementById(id);

let grid, tray, score, mult, over;

// --- shapes: random connected blobs of 4-6 cells ---------------------------------
function genShape(size) {
  const cells = [[0, 0]], seen = new Set(['0,0']);
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (cells.length < size) {
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    const [dr, dc] = dirs[Math.floor(Math.random() * 4)];
    const nr = r + dr, nc = c + dc, k = nr + ',' + nc;
    if (!seen.has(k)) { seen.add(k); cells.push([nr, nc]); }
  }
  const r0 = Math.min(...cells.map(p => p[0])), c0 = Math.min(...cells.map(p => p[1]));
  return cells.map(([r, c]) => [r - r0, c - c0]);
}

const newTray = () => [0, 1, 2].map(() => genShape(4 + Math.floor(Math.random() * 3)));

const fits = (shape, r, c) => shape.every(([dr, dc]) => {
  const rr = r + dr, cc = c + dc;
  return rr >= 0 && rr < H && cc >= 0 && cc < W && !grid[rr * W + cc];
});

const canPlace = shape => {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (fits(shape, r, c)) return true;
  return false;
};

// Drops a shape and clears any full rows. Returns rows cleared, or -1 if it doesn't fit.
function applyPlace(shape, r, c) {
  if (!fits(shape, r, c)) return -1;
  for (const [dr, dc] of shape) grid[(r + dr) * W + (c + dc)] = 1;
  const full = [];
  for (let rr = 0; rr < H; rr++) {
    let row = true;
    for (let cc = 0; cc < W; cc++) if (!grid[rr * W + cc]) { row = false; break; }
    if (row) full.push(rr);
  }
  if (full.length) {
    const kept = [];
    for (let rr = 0; rr < H; rr++) if (!full.includes(rr)) kept.push(grid.slice(rr * W, rr * W + W));
    grid = new Uint8Array(SIZE);
    kept.forEach((row, i) => grid.set(row, (H - kept.length + i) * W));
  }
  return full.length;
}

// Multiplier: +1 per row beyond the first on a multi-clear, -1 on a single clear (floor 1).
// Points: 10 per cleared cell, times the multiplier *after* this clear.
function award(rows) {
  if (rows >= 2) mult += rows - 1;
  else if (rows === 1) mult = Math.max(1, mult - 1);
  if (!rows) return 0;
  const gained = rows * W * 10 * mult;
  score += gained;
  return gained;
}

// --- ui ---------------------------------------------------------------------------
const boardEl = $('board');
const cells = Array.from({ length: SIZE }, () => {
  const el = document.createElement('div');
  el.className = 'cell';
  boardEl.append(el);
  return el;
});

function renderTray() {
  const el = $('tray');
  el.textContent = '';
  tray.forEach((shape, i) => {
    if (!shape) return;
    const w = Math.max(...shape.map(p => p[1])) + 1;
    const h = Math.max(...shape.map(p => p[0])) + 1;
    const box = document.createElement('div');
    box.className = 'shape';
    box.style.width = `calc(var(--pc) * ${w})`;
    box.style.height = `calc(var(--pc) * ${h})`;
    for (const [r, c] of shape) {
      const pc = document.createElement('div');
      pc.className = 'pc';
      pc.style.left = `calc(var(--pc) * ${c})`;
      pc.style.top = `calc(var(--pc) * ${r})`;
      box.append(pc);
    }
    box.addEventListener('pointerdown', e => startDrag(e, i));
    el.append(box);
  });
}

function draw() {
  for (let i = 0; i < SIZE; i++) cells[i].className = grid[i] ? 'cell on' : 'cell';
  $('score').textContent = score;
  $('mult').textContent = '×' + mult;
  renderTray();
}

const show = msg => { $('msg').textContent = msg; $('overlay').style.display = 'flex'; };

function init() {
  grid = new Uint8Array(SIZE);
  tray = newTray();
  score = 0; mult = 1; over = false;
  $('overlay').style.display = 'none';
  draw();
}

// --- drag and drop (pointer events cover mouse and touch) --------------------------
let drag = null, hinted = [];

function highlight(list) {
  for (const i of hinted) cells[i].className = grid[i] ? 'cell on' : 'cell';
  hinted = list;
  for (const i of hinted) cells[i].className = 'cell hint';
}

function startDrag(e, index) {
  if (over) return;
  e.preventDefault();
  const shape = tray[index];
  const rect = boardEl.getBoundingClientRect(), cell = rect.width / W;
  const ghost = document.createElement('div');
  ghost.id = 'ghost';
  for (const [r, c] of shape) {
    const pc = document.createElement('div');
    pc.className = 'pc';
    pc.style.width = pc.style.height = `${cell}px`;
    pc.style.left = `${c * cell}px`;
    pc.style.top = `${r * cell}px`;
    ghost.append(pc);
  }
  document.body.append(ghost);
  drag = { index, shape, ghost, cell, rect, r: 0, c: 0 };
  moveDrag(e);
  addEventListener('pointermove', moveDrag);
  addEventListener('pointerup', endDrag);
}

function moveDrag(e) {
  if (!drag) return;
  const { shape, ghost, cell, rect } = drag;
  const r = Math.round((e.clientY - rect.top - cell / 2) / cell);
  const c = Math.round((e.clientX - rect.left - cell / 2) / cell);
  ghost.style.left = `${rect.left + c * cell}px`;
  ghost.style.top = `${rect.top + r * cell}px`;
  drag.r = r; drag.c = c;
  highlight(fits(shape, r, c) ? shape.map(([dr, dc]) => (r + dr) * W + (c + dc)) : []);
}

function endDrag() {
  removeEventListener('pointermove', moveDrag);
  removeEventListener('pointerup', endDrag);
  if (!drag) return;
  const { index, shape, r, c, ghost } = drag;
  ghost.remove();
  highlight([]);
  drag = null;
  drop(index, shape, r, c);
}

function drop(index, shape, r, c) {
  const rows = applyPlace(shape, r, c);
  if (rows < 0) return;
  tray[index] = null;
  award(rows);
  if (!tray.some(Boolean)) tray = newTray();
  draw();
  if (!tray.some(canPlace)) { over = true; show('No moves left'); }
}

$('reset').addEventListener('click', init);
$('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
