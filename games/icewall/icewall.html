<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>icewall</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, sans-serif; color: #cfe8ff;
    display: flex; flex-direction: column; align-items: center; gap: .8rem;
    padding: 1rem; user-select: none; -webkit-user-select: none;
    background: radial-gradient(120% 80% at 50% 0%, #1c2c52 0%, #0b1224 70%);
  }
  header { width: min(96vw, 46vh); display: flex; align-items: center; gap: .6rem; }
  h1 { margin: 0 auto 0 0; font-size: 1.4rem; letter-spacing: .15em; }
  .stat { background: #223154; padding: .35rem .7rem; border-radius: 6px; font-size: .7rem; text-align: center; line-height: 1.3; }
  .stat b { display: block; font-size: 1.05rem; color: #9fe8ff; }
  button { font: inherit; font-size: .85rem; padding: .5rem .8rem; border: 0; border-radius: 6px; background: #3d6ea8; color: #eaf6ff; cursor: pointer; }

  #board {
    --w: 10; --h: 16;
    position: relative; width: min(96vw, 46vh); aspect-ratio: 10 / 16;
    background: linear-gradient(#0a1122, #16233f); border-radius: 8px;
    touch-action: none; box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
  }
  .slot, .block { position: absolute; width: calc(100% / var(--w)); height: calc(100% / var(--h)); }
  .slot { border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(90, 130, 190, .16); }
  .slot.hint { box-shadow: inset 0 0 0 2px rgba(214, 246, 255, .85); background: rgba(127, 214, 255, .12); }

  .block { will-change: left, top; }
  .block::after {
    content: ''; position: absolute; inset: 5%; border-radius: 4px;
    background: linear-gradient(160deg, var(--c1, #f2fbff) 0%, var(--c2, #7fd6ff) 46%, var(--c3, #2a6fae) 100%);
    box-shadow:
      inset 0 3px 2px -1px rgba(255, 255, 255, .95),
      inset 3px 0 3px -2px rgba(255, 255, 255, .6),
      inset -3px -4px 6px -1px rgba(0, 35, 70, .65),
      0 4px 6px rgba(0, 0, 0, .5);
  }
  .block.freeze { animation: freeze .22s ease-out; }
  @keyframes freeze { from { transform: scale(1.16); filter: brightness(2.4); } to { transform: scale(1); filter: none; } }

  /* cleared blocks are replaced by ice shards that fly out and fall off the board */
  .shard { position: absolute; width: calc(100% / var(--w)); height: calc(100% / var(--h)); animation: shard .6s cubic-bezier(.35, .1, .7, .5) forwards; }
  .shard::after {
    content: ''; position: absolute; inset: 16%;
    background: linear-gradient(160deg, var(--c1, #eafaff), var(--c2, #7fd6ff) 55%, var(--c3, #2f8fd0));
    clip-path: polygon(12% 0, 100% 22%, 78% 100%, 0 68%);
    box-shadow: 0 2px 4px rgba(0, 0, 0, .5);
  }
  @keyframes shard {
    to { transform: translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity: 0; }
  }

  /* a cleared column slides down and off the board instead of shattering */
  .block.colslide { animation: colslide .5s cubic-bezier(.45, 0, .9, .55) forwards; }
  @keyframes colslide { to { transform: translateY(1800%); opacity: .25; } }

  .popscore {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
    font-size: clamp(1.8rem, 10vmin, 3.4rem); font-weight: 800; color: #eafaff;
    text-shadow: 0 0 14px rgba(127, 214, 255, .95), 0 3px 6px rgba(0, 0, 0, .7);
    pointer-events: none; animation: popscore 1s ease-out forwards;
  }
  @keyframes popscore {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.5); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -140%) scale(1.5); }
  }

  #tray {
    --pc: calc(min(96vw, 46vh) * .06);
    display: flex; align-items: center; justify-content: center; gap: 1.2rem;
    min-height: 6rem; width: min(96vw, 46vh); touch-action: none;
  }
  .shape { position: relative; cursor: grab; }
  .pc {
    position: absolute; width: var(--pc); height: var(--pc); border-radius: 4px;
    background: linear-gradient(160deg, var(--c1, #f2fbff) 0%, var(--c2, #7fd6ff) 46%, var(--c3, #2a6fae) 100%);
    box-shadow:
      inset 0 2px 1px -1px rgba(255, 255, 255, .95),
      inset -2px -3px 4px -1px rgba(0, 35, 70, .6),
      0 3px 4px rgba(0, 0, 0, .45);
  }

  #ghost { position: fixed; z-index: 10; pointer-events: none; opacity: .85; }

  #overlay {
    position: fixed; inset: 0; display: none; flex-direction: column; z-index: 20;
    align-items: center; justify-content: center; gap: 1rem;
    background: rgba(9, 14, 30, .82); font-size: 1.5rem; font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>ICEWALL</h1>
  <div class="stat">Score<b id="score">0</b></div>
  <div class="stat">Mult<b id="mult">×1</b></div>
  <button id="reset">Reset</button>
</header>
<div id="board"></div>
<div id="tray"></div>
<div id="overlay"><p id="msg"></p><button id="restart">New game</button></div>

<script>
const W = 10, H = 16, SIZE = W * H, $ = id => document.getElementById(id);

// Fixed shape set: I, L, reverse L, T, block (2x2), and 2x3 / 3x2 blocks.
const SHAPES = [
  [[0, 0], [0, 1], [0, 2], [0, 3]],                          // I
  [[0, 0], [1, 0], [2, 0], [2, 1]],                          // L
  [[0, 0], [0, 1], [1, 0], [2, 0]],                          // reverse L
  [[0, 0], [0, 1], [0, 2], [1, 1]],                          // T
  [[0, 0], [0, 1], [1, 0], [1, 1]],                          // block
  [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]],          // 2x3
  [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]],          // 3x2
];

// Icy palette: blues dominate so the wall still reads cold, with a few coloured-ice accents.
const PALETTE = [
  ['#eafaff', '#7fd6ff', '#2f8fd0'], // ice blue
  ['#dff6ff', '#6ec8f0', '#2a6fae'], // deep blue
  ['#f4fcff', '#a8e6ff', '#5cb6e6'], // pale blue
  ['#ffe8e8', '#ff9f9f', '#d25555'], // red ice
  ['#e8fff2', '#8ee6b4', '#3fa06a'], // green ice
  ['#f0e8ff', '#b3a8ff', '#6f63c4'], // violet ice
];
const COLOR_POOL = [0, 1, 2, 0, 1, 2, 0, 1, 2, 3, 4, 5];
const randomColor = () => COLOR_POOL[Math.floor(Math.random() * COLOR_POOL.length)];

const paint = (el, color) => {
  const [c1, c2, c3] = PALETTE[color] || PALETTE[0];
  el.style.setProperty('--c1', c1);
  el.style.setProperty('--c2', c2);
  el.style.setProperty('--c3', c3);
};

let grid, blocks, tray, score, mult, over, busy;

const newTray = () => [0, 1, 2].map(() => ({
  cells: SHAPES[Math.floor(Math.random() * SHAPES.length)],
  color: randomColor(),
}));

const fits = (shape, r, c) => shape.every(([dr, dc]) => {
  const rr = r + dr, cc = c + dc;
  return rr >= 0 && rr < H && cc >= 0 && cc < W && !grid[rr * W + cc];
});

const canPlace = shape => {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (fits(shape, r, c)) return true;
  return false;
};

// --- logic (kept render-free so it can be tested) ---------------------------------
function placeShape(shape, r, c) {
  if (!fits(shape, r, c)) return false;
  for (const [dr, dc] of shape) grid[(r + dr) * W + (c + dc)] = 1;
  return true;
}

function fullRows() {
  const rows = [];
  for (let rr = 0; rr < H; rr++) {
    let full = true;
    for (let cc = 0; cc < W; cc++) if (!grid[rr * W + cc]) { full = false; break; }
    if (full) rows.push(rr);
  }
  return rows;
}

function clearRows(rows) {
  if (!rows.length) return 0;
  const kept = [];
  for (let rr = 0; rr < H; rr++) if (!rows.includes(rr)) kept.push(grid.slice(rr * W, rr * W + W));
  grid = new Uint8Array(SIZE);
  kept.forEach((row, i) => grid.set(row, (H - kept.length + i) * W));
  return rows.length;
}

function fullCols() {
  const cols = [];
  for (let cc = 0; cc < W; cc++) {
    let full = true;
    for (let rr = 0; rr < H; rr++) if (!grid[rr * W + cc]) { full = false; break; }
    if (full) cols.push(cc);
  }
  return cols;
}

function clearCols(cols) {
  for (const cc of cols) for (let rr = 0; rr < H; rr++) grid[rr * W + cc] = 0;
  return cols.length;
}

const applyPlace = (shape, r, c) => {
  if (!placeShape(shape, r, c)) return -1;
  return clearRows(fullRows()) + clearCols(fullCols());
};

// Multiplier: +1 per line beyond the first on a multi-clear, -1 on a single clear (floor 1).
// Points: 10 per cleared cell (a row is W cells, a column is H), times the multiplier after this clear.
function award(rows, cols) {
  const lines = rows + cols;
  if (lines >= 2) mult += lines - 1;
  else if (lines === 1) mult = Math.max(1, mult - 1);
  if (!lines) return 0;
  const gained = (rows * W + cols * H) * 10 * mult;
  score += gained;
  return gained;
}

// --- render: one positioned element per filled cell, so clears can slide ----------
const boardEl = $('board');
boardEl.style.setProperty('--w', W);
boardEl.style.setProperty('--h', H);

const setPos = (el, r, c) => {
  el.style.left = `${(c * 100) / W}%`;
  el.style.top = `${(r * 100) / H}%`;
};

const slots = Array.from({ length: SIZE }, (_, i) => {
  const el = document.createElement('div');
  el.className = 'slot';
  setPos(el, (i / W) | 0, i % W);
  boardEl.append(el);
  return el;
});

function addBlock(r, c, color) {
  const el = document.createElement('div');
  el.className = 'block freeze';
  el._color = color;
  paint(el, color);
  setPos(el, r, c);
  boardEl.append(el);
  blocks[r * W + c] = el;
}

function moveBlock(from, to) {
  const el = blocks[from];
  blocks[from] = null;
  blocks[to] = el;
  const fromLeft = el.style.left, fromTop = el.style.top;
  setPos(el, (to / W) | 0, to % W);
  if (el.animate) el.animate(
    [{ left: fromLeft, top: fromTop }, { left: el.style.left, top: el.style.top }],
    { duration: 300, easing: 'cubic-bezier(.3, .8, .4, 1)' },
  );
}

// Replace a cleared block with a handful of shards that fly out and fall off the board.
function shard(r, c, color) {
  const el = document.createElement('div');
  el.className = 'shard';
  paint(el, color);
  setPos(el, r, c);
  el.style.setProperty('--tx', `${((Math.random() * 2 - 1) * 220).toFixed(0)}%`);
  el.style.setProperty('--ty', `${(250 + Math.random() * 350).toFixed(0)}%`);
  el.style.setProperty('--rot', `${((Math.random() * 2 - 1) * 720).toFixed(0)}deg`);
  el.style.animationDelay = `${(Math.random() * 0.15).toFixed(2)}s`;
  boardEl.append(el);
  setTimeout(() => el.remove(), 900);
}

function breakBlock(i) {
  const el = blocks[i];
  if (!el) return;
  blocks[i] = null;
  const r = (i / W) | 0, c = i % W;
  el.remove();
  for (let k = 0; k < 4; k++) shard(r, c, el._color);
}

// A cleared column doesn't shatter: its blocks slide down and off the board.
function slideColumn(col) {
  for (let r = 0; r < H; r++) {
    const i = r * W + col;
    const el = blocks[i];
    if (!el) continue;
    blocks[i] = null;
    el.classList.add('colslide');
    setTimeout(() => el.remove(), 560);
  }
}

// Big "+N" that blooms across the board when points land.
function popScore(pts) {
  const el = document.createElement('div');
  el.className = 'popscore';
  el.textContent = '+' + pts;
  boardEl.append(el);
  setTimeout(() => el.remove(), 1000);
}

function renderTray() {
  const el = $('tray');
  el.textContent = '';
  tray.forEach((item, i) => {
    if (!item) return;
    const shape = item.cells;
    const w = Math.max(...shape.map(p => p[1])) + 1;
    const h = Math.max(...shape.map(p => p[0])) + 1;
    const box = document.createElement('div');
    box.className = 'shape';
    box.style.width = `calc(var(--pc) * ${w})`;
    box.style.height = `calc(var(--pc) * ${h})`;
    paint(box, item.color);
    for (const [r, c] of shape) {
      const pc = document.createElement('div');
      pc.className = 'pc';
      pc.style.left = `calc(var(--pc) * ${c})`;
      pc.style.top = `calc(var(--pc) * ${r})`;
      box.append(pc);
    }
    box.addEventListener('pointerdown', e => onDown(e, i));
    el.append(box);
  });
}

function draw() {
  $('score').textContent = score;
  $('mult').textContent = '×' + mult;
  renderTray();
}

const show = msg => { $('msg').textContent = msg; $('overlay').style.display = 'flex'; };

function init() {
  grid = new Uint8Array(SIZE);
  blocks = Array(SIZE).fill(null);
  boardEl.querySelectorAll('.block, .shard, .popscore').forEach(el => el.remove());
  tray = newTray();
  score = 0; mult = 1; over = false; busy = false;
  $('overlay').style.display = 'none';
  draw();
}

// --- drag and drop (pointer events cover mouse and touch) --------------------------
// A tap on a tray shape rotates it; a drag places it. We only start dragging once the
// finger has moved past a threshold, so a tap never creates a ghost.
let drag = null, pending = null, hinted = [];

function highlight(list) {
  for (const i of hinted) slots[i].className = 'slot';
  hinted = list;
  for (const i of hinted) slots[i].className = 'slot hint';
}

const rotate = shape => {
  const h = Math.max(...shape.map(p => p[0]));
  const cells = shape.map(([r, c]) => [c, h - r]);
  const r0 = Math.min(...cells.map(p => p[0])), c0 = Math.min(...cells.map(p => p[1]));
  return cells.map(([r, c]) => [r - r0, c - c0]);
};

function onDown(e, index) {
  if (over || busy || !tray[index]) return;
  e.preventDefault();
  pending = { index, x: e.clientX, y: e.clientY };
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
  addEventListener('pointercancel', onCancel);
}

function onMove(e) {
  if (!drag && pending) {
    if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) < 8) return;
    beginDrag(e, pending.index);
  }
  if (drag) moveDrag(e);
}

const endListeners = () => {
  removeEventListener('pointermove', onMove);
  removeEventListener('pointerup', onUp);
  removeEventListener('pointercancel', onCancel);
};

function onUp() {
  endListeners();
  if (drag) endDrag();
  else if (pending) {
    const item = tray[pending.index];
    tray[pending.index] = { cells: rotate(item.cells), color: item.color };
    renderTray();
  }
  pending = null;
}

// gesture interrupted (e.g. the OS takes over): drop everything, place nothing
function onCancel() {
  endListeners();
  if (drag) { drag.ghost.remove(); highlight([]); drag = null; }
  pending = null;
}

function beginDrag(e, index) {
  const { cells: shape, color } = tray[index];
  const rect = boardEl.getBoundingClientRect(), cell = rect.width / W;
  const ghost = document.createElement('div');
  ghost.id = 'ghost';
  paint(ghost, color);
  for (const [r, c] of shape) {
    const pc = document.createElement('div');
    pc.className = 'pc';
    pc.style.width = pc.style.height = `${cell}px`;
    pc.style.left = `${c * cell}px`;
    pc.style.top = `${r * cell}px`;
    ghost.append(pc);
  }
  document.body.append(ghost);
  drag = { index, shape, ghost, cell, rect, r: 0, c: 0 };
  moveDrag(e);
}

function moveDrag(e) {
  if (!drag) return;
  const { shape, ghost, cell, rect } = drag;
  // LIFT: drop the shape three cells above the finger so it isn't hidden by your hand.
  const LIFT = 3;
  const r = Math.round((e.clientY - rect.top - cell / 2 - LIFT * cell) / cell);
  const c = Math.round((e.clientX - rect.left - cell / 2) / cell);
  ghost.style.left = `${rect.left + c * cell}px`;
  ghost.style.top = `${rect.top + r * cell}px`;
  drag.r = r; drag.c = c;
  highlight(fits(shape, r, c) ? shape.map(([dr, dc]) => (r + dr) * W + (c + dc)) : []);
}

function endDrag() {
  if (!drag) return;
  const { index, shape, r, c, ghost } = drag;
  ghost.remove();
  highlight([]);
  drag = null;
  drop(index, shape, r, c);
}

function drop(index, shape, r, c) {
  if (busy || !placeShape(shape, r, c)) return;
  const color = tray[index] ? tray[index].color : 0;
  for (const [dr, dc] of shape) addBlock(r + dr, c + dc, color);
  tray[index] = null;

  // full rows shatter, and the blocks above them slide down to fill the gap
  const rows = fullRows();
  if (rows.length) {
    for (const rr of rows) for (let cc = 0; cc < W; cc++) breakBlock(rr * W + cc);
    for (let rr = H - 1; rr >= 0; rr--) {
      if (rows.includes(rr)) continue;
      const nr = rr + rows.filter(x => x > rr).length;
      if (nr !== rr) for (let cc = 0; cc < W; cc++) if (blocks[rr * W + cc]) moveBlock(rr * W + cc, nr * W + cc);
    }
    clearRows(rows);
  }

  // full columns slide down off the board
  const cols = fullCols();
  if (cols.length) {
    for (const cc of cols) slideColumn(cc);
    clearCols(cols);
  }

  const lines = rows.length + cols.length;
  if (lines) {
    busy = true;
    setTimeout(() => { busy = false; afterDrop(rows.length, cols.length); }, cols.length ? 560 : 320);
  } else {
    afterDrop(0, 0);
  }
}

function afterDrop(rows, cols) {
  const gained = award(rows, cols);
  if (gained) popScore(gained);
  if (!tray.some(Boolean)) tray = newTray();
  draw();
  if (!tray.some(s => s && canPlace(s.cells))) { over = true; show('No moves left'); }
}

$('reset').addEventListener('click', init);
$('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
