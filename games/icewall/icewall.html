<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>icewall</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: system-ui, sans-serif; color: #cfe8ff;
    display: flex; flex-direction: column; align-items: center; gap: .8rem;
    padding: 1rem; user-select: none; -webkit-user-select: none;
    background: radial-gradient(120% 80% at 50% 0%, #1c2c52 0%, #0b1224 70%);
  }
  header { width: min(94vw, 40vh); display: flex; align-items: center; gap: .6rem; }
  h1 { margin: 0 auto 0 0; font-size: 1.4rem; letter-spacing: .15em; }
  .stat { background: #223154; padding: .35rem .7rem; border-radius: 6px; font-size: .7rem; text-align: center; line-height: 1.3; }
  .stat b { display: block; font-size: 1.05rem; color: #9fe8ff; }
  button { font: inherit; font-size: .85rem; padding: .5rem .8rem; border: 0; border-radius: 6px; background: #3d6ea8; color: #eaf6ff; cursor: pointer; }

  #board {
    --w: 10; --h: 16;
    position: relative; width: min(94vw, 40vh); aspect-ratio: 10 / 16;
    background: linear-gradient(#0a1122, #16233f); border-radius: 8px;
    touch-action: none; box-shadow: 0 20px 45px rgba(0, 0, 0, .5);
    transform: perspective(1100px) rotateX(12deg); transform-style: preserve-3d;
  }
  .slot, .block { position: absolute; width: calc(100% / var(--w)); height: calc(100% / var(--h)); }
  .slot { border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(90, 130, 190, .16); }
  .slot.hint { box-shadow: inset 0 0 0 2px rgba(214, 246, 255, .85); background: rgba(127, 214, 255, .12); }

  .block { transition: left .28s cubic-bezier(.3, .8, .4, 1), top .28s cubic-bezier(.3, .8, .4, 1); will-change: left, top; }
  .block::after {
    content: ''; position: absolute; inset: 6%; border-radius: 3px;
    background: linear-gradient(160deg, #d6f4ff 0%, #7fd6ff 45%, #2f8fd0 100%);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .85), inset 0 -4px 7px rgba(0, 40, 80, .5), 0 3px 5px rgba(0, 0, 0, .4);
  }
  .block.freeze { animation: freeze .22s ease-out; }
  @keyframes freeze { from { transform: scale(1.16); filter: brightness(2.4); } to { transform: scale(1); filter: none; } }
  .block.break { animation: shatter .32s ease-in forwards; }
  @keyframes shatter {
    to { transform: translate(calc(var(--dx) * 70%), 25%) rotate(calc(var(--dx) * 28deg)); opacity: 0; }
  }

  #tray {
    --pc: calc(min(94vw, 40vh) * .06);
    display: flex; align-items: center; justify-content: center; gap: 1.2rem;
    min-height: 6rem; width: min(94vw, 40vh); touch-action: none;
  }
  .shape { position: relative; cursor: grab; }
  .pc {
    position: absolute; width: var(--pc); height: var(--pc); border-radius: 3px;
    background: linear-gradient(160deg, #d6f4ff, #7fd6ff 45%, #2f8fd0);
    box-shadow: inset 0 2px 0 rgba(255, 255, 255, .85), 0 2px 4px rgba(0, 0, 0, .4);
  }

  #ghost { position: fixed; z-index: 10; pointer-events: none; opacity: .8; }
  #ghost .pc { background: linear-gradient(160deg, #d6f4ff, #9fe8ff 45%, #4fa8e0); }

  #overlay {
    position: fixed; inset: 0; display: none; flex-direction: column; z-index: 20;
    align-items: center; justify-content: center; gap: 1rem;
    background: rgba(9, 14, 30, .82); font-size: 1.5rem; font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <h1>ICEWALL</h1>
  <div class="stat">Score<b id="score">0</b></div>
  <div class="stat">Mult<b id="mult">×1</b></div>
  <button id="reset">Reset</button>
</header>
<div id="board"></div>
<div id="tray"></div>
<div id="overlay"><p id="msg"></p><button id="restart">New game</button></div>

<script>
const W = 10, H = 16, SIZE = W * H, $ = id => document.getElementById(id);

// Fixed shape set: I, L, reverse L, T, block (2x2), and 2x3 / 3x2 blocks.
const SHAPES = [
  [[0, 0], [0, 1], [0, 2], [0, 3]],                          // I
  [[0, 0], [1, 0], [2, 0], [2, 1]],                          // L
  [[0, 0], [0, 1], [1, 0], [2, 0]],                          // reverse L
  [[0, 0], [0, 1], [0, 2], [1, 1]],                          // T
  [[0, 0], [0, 1], [1, 0], [1, 1]],                          // block
  [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]],          // 2x3
  [[0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]],          // 3x2
];

let grid, blocks, tray, score, mult, over, busy;

const newTray = () => [0, 1, 2].map(() => SHAPES[Math.floor(Math.random() * SHAPES.length)]);

const fits = (shape, r, c) => shape.every(([dr, dc]) => {
  const rr = r + dr, cc = c + dc;
  return rr >= 0 && rr < H && cc >= 0 && cc < W && !grid[rr * W + cc];
});

const canPlace = shape => {
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) if (fits(shape, r, c)) return true;
  return false;
};

// --- logic (kept render-free so it can be tested) ---------------------------------
function placeShape(shape, r, c) {
  if (!fits(shape, r, c)) return false;
  for (const [dr, dc] of shape) grid[(r + dr) * W + (c + dc)] = 1;
  return true;
}

function fullRows() {
  const rows = [];
  for (let rr = 0; rr < H; rr++) {
    let full = true;
    for (let cc = 0; cc < W; cc++) if (!grid[rr * W + cc]) { full = false; break; }
    if (full) rows.push(rr);
  }
  return rows;
}

function clearRows(rows) {
  if (!rows.length) return 0;
  const kept = [];
  for (let rr = 0; rr < H; rr++) if (!rows.includes(rr)) kept.push(grid.slice(rr * W, rr * W + W));
  grid = new Uint8Array(SIZE);
  kept.forEach((row, i) => grid.set(row, (H - kept.length + i) * W));
  return rows.length;
}

const applyPlace = (shape, r, c) => placeShape(shape, r, c) ? clearRows(fullRows()) : -1;

// Multiplier: +1 per row beyond the first on a multi-clear, -1 on a single clear (floor 1).
// Points: 10 per cleared cell, times the multiplier *after* this clear.
function award(rows) {
  if (rows >= 2) mult += rows - 1;
  else if (rows === 1) mult = Math.max(1, mult - 1);
  if (!rows) return 0;
  const gained = rows * W * 10 * mult;
  score += gained;
  return gained;
}

// --- render: one positioned element per filled cell, so clears can slide ----------
const boardEl = $('board');
boardEl.style.setProperty('--w', W);
boardEl.style.setProperty('--h', H);

const setPos = (el, r, c) => {
  el.style.left = `calc(100% * ${c} / ${W})`;
  el.style.top = `calc(100% * ${r} / ${H})`;
};

const slots = Array.from({ length: SIZE }, (_, i) => {
  const el = document.createElement('div');
  el.className = 'slot';
  setPos(el, (i / W) | 0, i % W);
  boardEl.append(el);
  return el;
});

function addBlock(r, c) {
  const el = document.createElement('div');
  el.className = 'block freeze';
  el.style.setProperty('--dx', c < W / 2 ? -1 : 1);
  setPos(el, r, c);
  boardEl.append(el);
  blocks[r * W + c] = el;
}

function moveBlock(from, to) {
  const el = blocks[from];
  blocks[from] = null;
  blocks[to] = el;
  setPos(el, (to / W) | 0, to % W);
}

function breakBlock(i) {
  const el = blocks[i];
  if (!el) return;
  blocks[i] = null;
  el.classList.add('break');
  setTimeout(() => el.remove(), 320);
}

function renderTray() {
  const el = $('tray');
  el.textContent = '';
  tray.forEach((shape, i) => {
    if (!shape) return;
    const w = Math.max(...shape.map(p => p[1])) + 1;
    const h = Math.max(...shape.map(p => p[0])) + 1;
    const box = document.createElement('div');
    box.className = 'shape';
    box.style.width = `calc(var(--pc) * ${w})`;
    box.style.height = `calc(var(--pc) * ${h})`;
    for (const [r, c] of shape) {
      const pc = document.createElement('div');
      pc.className = 'pc';
      pc.style.left = `calc(var(--pc) * ${c})`;
      pc.style.top = `calc(var(--pc) * ${r})`;
      box.append(pc);
    }
    box.addEventListener('pointerdown', e => startDrag(e, i));
    el.append(box);
  });
}

function draw() {
  $('score').textContent = score;
  $('mult').textContent = '×' + mult;
  renderTray();
}

const show = msg => { $('msg').textContent = msg; $('overlay').style.display = 'flex'; };

function init() {
  grid = new Uint8Array(SIZE);
  blocks = Array(SIZE).fill(null);
  boardEl.querySelectorAll('.block').forEach(el => el.remove());
  tray = newTray();
  score = 0; mult = 1; over = false; busy = false;
  $('overlay').style.display = 'none';
  draw();
}

// --- drag and drop (pointer events cover mouse and touch) --------------------------
let drag = null, hinted = [];

function highlight(list) {
  for (const i of hinted) slots[i].className = 'slot';
  hinted = list;
  for (const i of hinted) slots[i].className = 'slot hint';
}

function startDrag(e, index) {
  if (over || busy) return;
  e.preventDefault();
  const shape = tray[index];
  const rect = boardEl.getBoundingClientRect(), cell = rect.width / W;
  const ghost = document.createElement('div');
  ghost.id = 'ghost';
  for (const [r, c] of shape) {
    const pc = document.createElement('div');
    pc.className = 'pc';
    pc.style.width = pc.style.height = `${cell}px`;
    pc.style.left = `${c * cell}px`;
    pc.style.top = `${r * cell}px`;
    ghost.append(pc);
  }
  document.body.append(ghost);
  drag = { index, shape, ghost, cell, rect, r: 0, c: 0 };
  moveDrag(e);
  addEventListener('pointermove', moveDrag);
  addEventListener('pointerup', endDrag);
}

function moveDrag(e) {
  if (!drag) return;
  const { shape, ghost, cell, rect } = drag;
  // LIFT: drop the shape four cells above the finger so it isn't hidden by your hand.
  const LIFT = 4;
  const r = Math.round((e.clientY - rect.top - cell / 2 - LIFT * cell) / cell);
  const c = Math.round((e.clientX - rect.left - cell / 2) / cell);
  ghost.style.left = `${rect.left + c * cell}px`;
  ghost.style.top = `${rect.top + r * cell}px`;
  drag.r = r; drag.c = c;
  highlight(fits(shape, r, c) ? shape.map(([dr, dc]) => (r + dr) * W + (c + dc)) : []);
}

function endDrag() {
  removeEventListener('pointermove', moveDrag);
  removeEventListener('pointerup', endDrag);
  if (!drag) return;
  const { index, shape, r, c, ghost } = drag;
  ghost.remove();
  highlight([]);
  drag = null;
  drop(index, shape, r, c);
}

function drop(index, shape, r, c) {
  if (busy || !placeShape(shape, r, c)) return;
  for (const [dr, dc] of shape) addBlock(r + dr, c + dc);
  tray[index] = null;

  const rows = fullRows();
  if (rows.length) {
    busy = true;
    // clear the dying blocks first (frees their cells, keeps their elements alive to animate)
    for (const rr of rows) for (let cc = 0; cc < W; cc++) breakBlock(rr * W + cc);
    // survivors fall by the number of cleared rows *below* them; bottom-up so moves don't clobber
    for (let rr = H - 1; rr >= 0; rr--) {
      if (rows.includes(rr)) continue;
      const nr = rr + rows.filter(x => x > rr).length;
      if (nr !== rr) for (let cc = 0; cc < W; cc++) if (blocks[rr * W + cc]) moveBlock(rr * W + cc, nr * W + cc);
    }
    clearRows(rows);
    setTimeout(() => { busy = false; afterDrop(rows.length); }, 320);
  } else {
    afterDrop(0);
  }
}

function afterDrop(rows) {
  award(rows);
  if (!tray.some(Boolean)) tray = newTray();
  draw();
  if (!tray.some(s => s && canPlace(s))) { over = true; show('No moves left'); }
}

$('reset').addEventListener('click', init);
$('restart').addEventListener('click', init);
init();
</script>
</body>
</html>
